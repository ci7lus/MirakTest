name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
    paths-ignore:
      - .gitignore
      - LICENSE
      - "**.md"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      override_version:
        type: boolean
        description: Set version to nightly
        default: true

jobs:
  lint:
    runs-on: ubuntu-22.04

    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [16.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - name: Install
        run: |
          yarn install
      - name: Lint
        run: |
          yarn lint:prettier
          yarn lint:eslint
      - name: Typecheck
        run: |
          yarn typecheck
  build:
    needs: lint

    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [16.x]
        # TODO: re-enable Linux/Windows after mpv cross-platform support
        target:
          - aarch64-apple-darwin
        include:
          - target: aarch64-apple-darwin
            os: macos-14  # Apple Silicon runner

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - uses: actions/cache@v3
        id: electron-cache
        # https://github.com/electron/get#how-it-works
        with:
          path: |
            ~/Library/Caches/electron/
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cmake-js
            $XDG_CACHE_HOME
          key: ${{ matrix.target }}-electron-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ matrix.target }}-electron-
      - name: Install mpv and dylibbundler
        run: |
          brew install mpv dylibbundler
      - name: Install
        run: yarn
      - name: Setup mpv libs
        run: ./setup_mpv_mac.sh
      - name: Build native addon
        run: |
          cd native/mpv-nsview
          npm install
          npx node-gyp rebuild --arch=arm64
      - name: Set nightly version
        if: ${{ github.event_name != 'release' && (!github.event.inputs.override_version || github.event.inputs.override_version == 'true') }}
        run: yarn ts-node setPackageVersion.ts
        env:
          SHA1: ${{ github.sha }}
      - name: Set buildVersion
        run: yarn ts-node setBuildVersion.ts
        env:
          SHA1: ${{ github.sha }}
          OS: ${{ runner.os }}
      - name: Build
        run: yarn build --mac --arm64
      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.target }}-build
          path: |
            build
            !build/mac/mirak.app
            !build/mac-*/mirak.app
            !build/*-unpacked
          if-no-files-found: ignore
      - name: Upload dist artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.target }}-dist
          path: dist
      - name: Upload build-image artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.target }}-build-image
          path: |
            build/*.dmg
            build/*.zip
          if-no-files-found: ignore
      - name: Upload build-image artifact (mac zip)
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.target }}-build-image-maczip
          path: |
            build/*-mac.zip
          if-no-files-found: ignore
      - name: Upload app to release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/*.dmg
            build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
